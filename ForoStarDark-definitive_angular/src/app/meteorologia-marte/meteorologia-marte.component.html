<h2>Clima en Marte (NASA InSight)</h2>

<div *ngIf="weatherData">
  <ul>
    <li *ngFor="let sol of weatherData.sol_keys">
      <strong>Sol {{ sol }}:</strong>
      <div>Temp media: {{ getTemperatura(sol) }}</div>
      <div>Máx: {{ getTempMax(sol) }}</div>
      <div>Mín: {{ getTempMin(sol) }}</div>
    </li>
  </ul>
</div>

<div *ngIf="!weatherData">
  <p>Cargando datos del clima marciano...</p>
</div>

<pre>{{ weatherData | json }}</pre>
